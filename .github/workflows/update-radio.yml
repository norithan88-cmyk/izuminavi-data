name: いずみラジオだけを更新
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-events
  cancel-in-progress: false
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 音声変換を準備
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: 曜日別の台本と音声を生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          node automation/radio/generate-daily-script.mjs automation/radio/daily-script.txt
          node automation/radio/generate-audio.mjs automation/radio/daily-script.txt automation/radio/daily.mp3
      - name: 音声生成成功後に保存
        run: |
          git config user.name "izuminavi-bot"
          git config user.email "izuminavi-bot@users.noreply.github.com"
          git add -- automation/radio/daily-script.txt automation/radio/daily.mp3 automation/radio/daily-sources.json
          if [ -f automation/radio/broadcast-history.json ]; then git add -- automation/radio/broadcast-history.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "曜日別いずみラジオを更新"
          git pull --rebase origin main
          git push
