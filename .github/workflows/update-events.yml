name: 地域情報を自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'

permissions:
  contents: write

# 同時に2つ動くとpushがぶつかるので、1つずつ順番に実行する
concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 1つが失敗しても他の収集・ラジオ・LINEは止めない（失敗した分は前回のデータを維持）
      - name: 安城市のイベントを収集
        continue-on-error: true
        run: node automation/events/collect-events.mjs

      - name: 安城市のニュースを収集
        continue-on-error: true
        run: node automation/news/collect-news.mjs

      - name: 安城市の求人を収集
        continue-on-error: true
        run: node automation/jobs/collect-jobs.mjs

      - name: 変更があるときだけ保存
        id: save
        shell: bash
        run: |
          if git diff --quiet -- automation/events/events.json automation/news/news.json automation/jobs/jobs.json; then
            echo "変更はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "izuminavi-bot"
          git config user.email "izuminavi-bot@users.noreply.github.com"
          git add -- automation/events/events.json automation/news/news.json automation/jobs/jobs.json
          git commit -m "地域情報を自動更新"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 新着情報をLINEへ投稿
        if: steps.save.outputs.changed == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node automation/line/send-update.mjs

      - name: 今日のいずみラジオ音声を生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          node automation/radio/generate-daily-script.mjs automation/radio/daily-script.txt
          node automation/radio/generate-audio.mjs automation/radio/daily-script.txt automation/radio/daily.mp3

      - name: ラジオ音声を保存
        shell: bash
        run: |
          if git diff --quiet -- automation/radio/daily-script.txt; then
            if ! git status --porcelain -- automation/radio/daily.mp3 | grep -q .; then
              echo "ラジオに変更はありません"
              exit 0
            fi
          fi
          git config user.name "izuminavi-bot"
          git config user.email "izuminavi-bot@users.noreply.github.com"
          git add -- automation/radio/daily-script.txt automation/radio/daily.mp3
          git commit -m "今日のいずみラジオ音声を更新"
          git pull --rebase origin main
          git push
