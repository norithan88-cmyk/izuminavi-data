name: 地域情報を自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安城市のイベント・ニュース・求人を収集
        run: |
          node automation/events/collect-events.mjs
          node automation/news/collect-news.mjs
          node automation/jobs/collect-jobs.mjs

      - name: 変更があるときだけ保存
        id: save
        shell: bash
        run: |
          if git diff --quiet -- automation/events/events.json automation/news/news.json automation/jobs/jobs.json; then
            echo "変更はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "izuminavi-bot"
          git config user.email "izuminavi-bot@users.noreply.github.com"
          git add -- automation/events/events.json automation/news/news.json automation/jobs/jobs.json
          git commit -m "地域情報を自動更新"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 新着情報をLINEへ投稿
        if: steps.save.outputs.changed == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node automation/line/send-update.mjs
